# Render Blueprint Specification for Civitas API
services:
  - type: web
    name: civitas-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /ready
    envVars:
      - key: CIVITAS_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://civitas-web.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: CIVITAS_WORKFLOW_CHECKPOINT_DATABASE_URL
        sync: false
      - key: CIVITAS_POSTGIS_DSN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CIVITAS_INTERNAL_API_KEY
        generateValue: true
      - key: CIVITAS_LLM_PRIMARY_MODEL
        value: llama-3.3-70b-versatile
      - key: CIVITAS_LLM_FAST_MODEL
        value: llama-3.1-8b-instant
