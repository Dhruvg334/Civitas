[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civitas-ml"
version = "0.1.0"
description = "Civitas ML/CV intelligence service: one typed, schema-validated ML integration boundary composing vision, embeddings, duplicates, clustering, severity, priority and resolution verification, with a backend-adapter interface (mock now, real APIs later)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3.0", "Pillow>=10.0"]

[project.optional-dependencies]
full = [
    "civitas-vision>=0.1.0",
    "civitas-duplicates>=0.1.0",
    "civitas-risk>=0.1.0",
    "civitas-resolution>=0.1.0",
    "civitas-geospatial>=0.1.0",
]
video = ["civitas-vision[video]>=0.1.0", "opencv-python-headless>=4.8,<5.0"]
http = ["httpx>=0.27,<1.0"]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0", "mypy>=1.14,<2.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "../../ml/vision/src",
    "../../ml/duplicates/src",
    "../../ml/risk/src",
    "../../ml/resolution/src",
    "../../geospatial/src",
]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = [
    "civitas_vision",
    "civitas_vision.*",
    "civitas_duplicates",
    "civitas_duplicates.*",
    "civitas_risk",
    "civitas_risk.*",
    "civitas_resolution",
    "civitas_resolution.*",
    "civitas_geo",
    "civitas_geo.*",
    "PIL",
    "PIL.*",
    "cv2",
    "httpx",
]
ignore_missing_imports = true
