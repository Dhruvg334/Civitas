[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civitas-api"
version = "0.1.0"
description = "Operational API for Civitas"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "psycopg[binary]>=3.3,<4.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.28,<1.0",
  "pillow>=10.0,<12.0",
  "civitas-geospatial>=0.1.0",
  "civitas-knowledge>=0.1.0",
  "civitas-ml>=0.1.0",
  "civitas-workflow>=0.1.0",
  "civitas-evaluation>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "../../services/ml/src",
  "../../ml/resolution/src",
  "../../ml/vision/src",
  "../../ml/nlp/src",
  "../../ml/spatial/src",
  "../../services/knowledge/src",
  "../../services/workflow/src",
  "../../services/evaluation/src",
  "../../packages/geospatial/src"
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
