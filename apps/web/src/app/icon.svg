<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Rounded Architectural Civic Frame -->
  <rect width="64" height="64" rx="14" fill="#172019" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#0f5f4f" stroke-width="2" />

  <!-- 4-Quadrant Civic Mosaic -->
  <!-- 01: Spatial GIS & Grounding (Forest Green) -->
  <rect x="13" y="13" width="17" height="17" rx="4" fill="#0f5f4f" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="21.5" cy="21.5" r="3.5" fill="#ffffff" />

  <!-- 02: Multimodal Incident Intake (Crimson Rose) -->
  <rect x="34" y="13" width="17" height="17" rx="4" fill="#e84d7a" stroke="#ffffff" stroke-width="1.5" />
  <path d="M42.5 18v7M39 21.5h7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- 03: Policy Playbook Compass (Golden Amber) -->
