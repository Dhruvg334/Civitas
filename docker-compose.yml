version: "3.8"

services:
  # Next.js Frontend (Product Interfaces)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: civitas-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
      - INTERNAL_API_URL=http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy

  # FastAPI Backend & ML Orchestration
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: civitas-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional Local Postgres + PostGIS Database (when not using Supabase cloud DSN)
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: civitas-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=civitas_dev
      - POSTGRES_DB=civitas
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    profiles:
      - local-db

volumes:
  pgdata:
