[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civitas-risk"
version = "0.1.0"
description = "Severity and priority assessment for Civitas: engineered geospatial features with an explainable ML/rule hybrid scorer."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3.0"]

[project.optional-dependencies]
geo = ["civitas-geospatial>=0.1.0"]
duplicates = ["civitas-duplicates>=0.1.0"]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0", "mypy>=1.14,<2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../geospatial/src"]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["civitas_geo", "civitas_geo.*", "PIL", "PIL.*", "cv2"]
ignore_missing_imports = true