[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civitas-duplicates"
version = "0.1.0"
description = "Duplicate incident detection for Civitas: embeddings, GPS, timestamps, landmarks and clustering."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3.0"]

[project.optional-dependencies]
geo = ["civitas-geospatial>=0.1.0"]
vision = ["civitas-vision>=0.1.0", "Pillow>=10.0"]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0", "mypy>=1.14,<2.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../geospatial/src", "../../vision/src"]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["civitas_geo", "civitas_geo.*", "civitas_vision", "civitas_vision.*", "PIL", "PIL.*", "cv2"]
ignore_missing_imports = true
