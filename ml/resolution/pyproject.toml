[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civitas-resolution"
version = "0.1.0"
description = "Resolution verification for Civitas: BEFORE/AFTER evidence comparison answering resolved, partial, unverifiable or conflicting."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3.0"]

[project.optional-dependencies]
vision = ["civitas-vision>=0.1.0", "Pillow>=10.0"]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0", "mypy>=1.14,<2.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../vision/src"]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["civitas_vision", "civitas_vision.*", "PIL", "PIL.*", "cv2"]
ignore_missing_imports = true
