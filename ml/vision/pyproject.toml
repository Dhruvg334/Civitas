[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civitas-vision"
version = "0.1.0"
description = "Computer vision pipeline for Civitas: media quality checks, frame selection, classical visual features, incident classification and evidence extraction."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<2.0", "pillow>=10,<12", "pydantic>=2.10,<3.0"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8,<5.0"]
nn = ["torch>=2.0,<3.0", "torchvision>=0.15,<1.0"]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0", "mypy>=1.14,<2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*", "cv2"]
ignore_missing_imports = true
